<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>Sem conexão | Lume</title>
  <style>
    :root { color-scheme: light; --bg: #fafaf9; --ink: #1b1b1a; --muted: #5f5f5b; }
    :root.dark { color-scheme: dark; --bg: #171715; --ink: #f3f3ef; --muted: #b5b5ad; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: var(--bg); color: var(--ink); font: 14px/1.6 system-ui, sans-serif; }
    main { width: 100%; max-width: 360px; }
    h1 { font: 400 32px/1.2 Georgia, serif; margin: 32px 0 16px; }
    p { color: var(--muted); margin-bottom: 24px; }
    button { min-height: 44px; padding: 10px 18px; border: 0; border-radius: 10px; background: var(--ink); color: var(--bg); font: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  </style>
  <script>
    function applyTheme() {
      var theme = "system";
      try { theme = localStorage.getItem("k5-theme") || "system"; } catch {}
      var dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
      document.querySelector('meta[name="theme-color"]').content = dark ? "#171715" : "#fafaf9";
    }
    applyTheme();
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
    addEventListener("storage", applyTheme);
  </script>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" width="48" height="48" alt="Lume">
    <h1>Você está sem conexão</h1>
    <p>Conecte-se à internet para acessar seu escritório. Seus documentos e conversas precisam de uma conexão segura com o Lume.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
