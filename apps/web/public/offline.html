<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>Sem conexão | Lume</title>
  <style>
    :root { color-scheme: light; --bg: #ffffff; --ink: #232323; --muted: #5c5c5c; --line: #232323; --brand: #d97757; }
    :root.dark { color-scheme: dark; --bg: #232323; --ink: #f5f5f5; --muted: #b8b8b8; --line: #5a5a5a; --brand: #e08a6b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: var(--bg); color: var(--ink); font: 14px/1.6 system-ui, sans-serif; letter-spacing: -.011em; }
    main { width: 100%; max-width: 400px; border-top: 1px solid var(--line); padding-top: 24px; }
    .label { font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; letter-spacing: .02em; color: var(--muted); display: flex; align-items: center; gap: 10px; margin: 0; }
    .label::before { content: ""; width: 8px; height: 8px; background: currentColor; }
    h1 { font: 450 40px/1 system-ui, sans-serif; letter-spacing: -.045em; margin: 24px 0 16px; }
    p { color: var(--muted); margin: 0 0 28px; }
    button { width: 100%; min-height: 48px; padding: 0 16px; border: 0; border-radius: 0; background: var(--ink); color: var(--bg); font: 500 15px/1 system-ui, sans-serif; text-align: left; cursor: pointer; transition: background-color .6s cubic-bezier(.16, 1, .3, 1), color .6s cubic-bezier(.16, 1, .3, 1); }
    button:hover, button:focus-visible { background: var(--brand); color: #232323; }
    button:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
  </style>
  <script>
    function applyTheme() {
      var theme = "system";
      try { theme = localStorage.getItem("k5-theme") || "system"; } catch {}
      var dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
      document.querySelector('meta[name="theme-color"]').content = dark ? "#232323" : "#ffffff";
    }
    applyTheme();
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
    addEventListener("storage", applyTheme);
  </script>
</head>
<body>
  <main>
    <p class="label">Lume</p>
    <h1>Você está sem conexão</h1>
    <p>Conecte-se à internet para acessar seu escritório. Seus documentos e conversas precisam de uma conexão segura com o Lume.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
