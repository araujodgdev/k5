<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FDFDFB">
  <meta name="robots" content="noindex">
  <title>Sem conexão | Lume</title>
  <style>
    :root { color-scheme: light; --bg: #FDFDFB; --ink: #1C1B19; --muted: #62615E; --line: rgb(28 27 25 / .14); --primary: #1C1B19; --on-primary: #FAFAF8; --brand: #E08A6B; }
    :root.dark { color-scheme: dark; --bg: #1A1918; --ink: #EDEBE6; --muted: #A19F9B; --line: rgb(255 255 255 / .12); --primary: #F3F1EC; --on-primary: #161514; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: var(--bg); color: var(--ink); font: 14px/1.6 system-ui, sans-serif; letter-spacing: -.011em; }
    main { width: 100%; max-width: 400px; border-top: 1px solid var(--line); padding-top: 24px; }
    .label { font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; letter-spacing: .02em; color: var(--muted); display: flex; align-items: center; gap: 10px; margin: 0; }
    .label::before { content: ""; width: 8px; height: 8px; background: currentColor; }
    h1 { font: 450 40px/1 system-ui, sans-serif; letter-spacing: -.045em; margin: 24px 0 16px; }
    p { color: var(--muted); margin: 0 0 28px; }
    button { width: 100%; min-height: 48px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--primary); color: var(--on-primary); font: 500 15px/1 system-ui, sans-serif; text-align: left; cursor: pointer; transition: background-color .15s cubic-bezier(.16, 1, .3, 1); }
    button:hover { background: color-mix(in oklab, var(--primary) 90%, transparent); }
    button:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
    .mark { display: block; width: 48px; height: 48px; margin: 0 0 28px; color: var(--ink); }
  </style>
  <script>
    function applyTheme() {
      var theme = "light";
      try { theme = localStorage.getItem("k5-theme") || "light"; } catch {}
      var dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
      document.querySelector('meta[name="theme-color"]').content = dark ? "#1A1918" : "#FDFDFB";
    }
    applyTheme();
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
    addEventListener("storage", applyTheme);
  </script>
</head>
<body>
  <main>
    <!-- The halves of the Lume mark, copied from src/components/lume-mark.tsx: this page runs without the app. -->
    <svg class="mark" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true">
      <path d="M55.37 3.05L3 42.91L34.43 81.75C34.85 79.68 34.04 74.28 33.95 71.75C33.68 64.53 33.83 57.38 36.18 50.5C41.44 35.07 64.8 28.37 58.89 11.05C57.95 8.29 56.86 5.55 55.37 3.05Z"/>
      <path d="M63.56 18.86C63.79 21.39 64.29 23.97 64.59 26.52C65.65 35.55 65.88 45.48 61.92 53.84C58 62.1 50.2 66.77 44.14 73.21C41 76.55 37.89 81.04 38.89 85.86C39.31 87.89 41.4 89.9 42.62 91.52L46.72 96.95L97 59.46L63.56 18.86Z"/>
    </svg>
    <p class="label">Lume</p>
    <h1>Você está sem conexão</h1>
    <p>Conecte-se à internet para acessar seu escritório. Seus documentos e conversas precisam de uma conexão segura com o Lume.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
