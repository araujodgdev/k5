# Local development environment for Lume.
#
# PostgreSQL stores all transactional data. A separate pgvector database remains optional for vectors.
#   docker compose up
#   docker compose --profile tools up -d adminer
# Secrets come from .env at the repository root; docker compose loads it automatically.

name: k5

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: k5
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-k5-local-dev}
      POSTGRES_DB: k5
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U k5 -d k5"]
      interval: 5s
      timeout: 5s
      retries: 20

  vectors:
    # pgvector on top of the official Postgres image. Only the vector index lives here.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: k5
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD:-k5-local-dev}
      POSTGRES_DB: k5_vectors
    volumes:
      - vectors:/var/lib/postgresql/data
    ports:
      # Exposed so `pnpm dev` outside Docker can use the same index.
      - "${VECTOR_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U k5 -d k5_vectors"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  setup:
    # Migrations run once per `up`, before anything serves traffic. Both web and worker wait for
    # this to exit cleanly, so neither races a half-applied schema.
    build: &app_build
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
        NEXT_PUBLIC_SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    command: ["pnpm", "db:setup"]
    environment: &app_env
      NODE_ENV: production
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      DATABASE_URL: postgresql://k5:${POSTGRES_PASSWORD:-k5-local-dev}@postgres:5432/k5
      VAULT_STORAGE_PATH: /data/uploads
      RESEARCH_STORAGE_PATH: /data/research-objects
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?defina BETTER_AUTH_SECRET no .env da raiz}
      K5_CREDENTIALS_KEY: ${K5_CREDENTIALS_KEY:?defina K5_CREDENTIALS_KEY no .env da raiz}
      K5_CREDENTIALS_PREVIOUS_KEYS: ${K5_CREDENTIALS_PREVIOUS_KEYS:-}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-28800}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-https://*.trycloudflare.com}
      VECTOR_INDEX_BACKEND: pgvector
      VECTOR_DATABASE_URL: postgresql://k5:${VECTOR_DB_PASSWORD:-k5-local-dev}@vectors:5432/k5_vectors
      VAULT_OCR_URL: ${VAULT_OCR_URL:-}
      VAULT_OCR_TOKEN: ${VAULT_OCR_TOKEN:-}
      K5_VAPID_KEY_ID: ${K5_VAPID_KEY_ID:-}
      K5_VAPID_SUBJECT: ${K5_VAPID_SUBJECT:-}
      K5_VAPID_PUBLIC_KEY: ${K5_VAPID_PUBLIC_KEY:-}
      K5_CLIENT_IP_HEADER: ${K5_CLIENT_IP_HEADER:-}
      # Google integration (docs/integracao-google.md). Empty values keep the integration disabled.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_PICKER_API_KEY: ${GOOGLE_PICKER_API_KEY:-}
      GOOGLE_PICKER_APP_ID: ${GOOGLE_PICKER_APP_ID:-}
      GOOGLE_CALENDAR_WEBHOOK_URL: ${GOOGLE_CALENDAR_WEBHOOK_URL:-}
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      vectors:
        condition: service_healthy
    restart: "no"

  web:
    build: *app_build
    environment: *app_env
    volumes:
      - appdata:/data
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      setup:
        condition: service_completed_successfully
      vectors:
        condition: service_healthy
    restart: unless-stopped

  worker:
    # Extraction, OCR, embeddings and deletion cleanup. Separate from web on purpose: a long OCR
    # pass must not compete with request handling, and it is the piece that scales independently.
    build: *app_build
    command: ["pnpm", "worker"]
    environment: *app_env
    volumes:
      - appdata:/data
    depends_on:
      setup:
        condition: service_completed_successfully
      vectors:
        condition: service_healthy
    restart: unless-stopped

  judicial-worker:
    # Gazette collection and jurisprudence ingestion share the database and public corpus objects
    # with web and the document worker, while remaining independent from OCR processing.
    build: *app_build
    command: ["pnpm", "judicial:worker"]
    environment: *app_env
    volumes:
      - appdata:/data
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  notifications:
    # Projection, civil-date reminders and Web Push delivery have their own queues so OCR cannot
    # delay a reminder. Without VAPID configuration the durable inbox still works.
    build: *app_build
    command: ["pnpm", "notifications:worker"]
    environment:
      <<: *app_env
      K5_VAPID_PRIVATE_KEY: ${K5_VAPID_PRIVATE_KEY:-}
    volumes:
      - appdata:/data
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  integrations:
    # Google sync, push-channel renewal, Drive imports and reconciliation of unknown outcomes.
    # PostgreSQL holds jobs, checkpoints and leases; without Google OAuth configured it stays idle.
    build: *app_build
    command: ["pnpm", "integrations:worker"]
    environment: *app_env
    volumes:
      - appdata:/data
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  adminer:
    image: adminer:5
    profiles: ["tools"]
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      vectors:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:3000"]
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  # Existing appdata is preserved; PostgreSQL has its own volume.
  postgres:
  appdata:
  vectors:
