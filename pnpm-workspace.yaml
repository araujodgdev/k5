packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-arm': false
  '@embedded-postgres/linux-ia32': false
  '@embedded-postgres/linux-ppc64': false
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/darwin-arm64': true
  '@sentry/cli': true
  esbuild: true
  sharp: false
  tesseract.js: false
  unrs-resolver: false
  workerd: true

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.5'
  - '@better-auth/drizzle-adapter@1.7.5'
  - '@better-auth/kysely-adapter@1.7.5'
  - '@better-auth/memory-adapter@1.7.5'
  - '@better-auth/mongo-adapter@1.7.5'
  - '@better-auth/prisma-adapter@1.7.5'
  - '@better-auth/telemetry@1.7.5'
  - better-auth@1.7.5
  - '@e2e-dev/web@0.11.1'
  - e2e@0.15.1
  - '@formepdf/core@0.27.0'
  - '@formepdf/react@0.27.0'
  - '@formepdf/shared@0.27.0'

# Security fixes for transitives whose parent packages still pin vulnerable versions.
overrides:
  'uuid@<11.1.1': 11.1.1
  'basic-ftp@<6.2.1': 6.2.2
  'fflate@<0.7.5': 0.8.3
  'sharp@<0.35.5': 0.35.5
